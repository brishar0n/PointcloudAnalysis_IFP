<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>
	
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');">

			<span style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10000">
				<input type="button" value="Colour By Classification" onclick="setClassificationColour()"/>
				<input type="button" value="Highlight Sidewalk Segments" onclick="setRealColours()"/>
			</span>

		</div>
		<div id="potree_sidebar_container"> </div>
	</div>
	
	<script type="module">

		import * as THREE from "../libs/three.js/build/three.module.js";
	
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		

		viewer.setDescription(`
		Classification Testing `);
		
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		
		viewer.loadGUI(() => {
			$("#menu_filters").next().show();
			viewer.toggleSidebar();
		});
		
		Potree.loadPointCloud("pointclouds/riga/city/cloud.js", "City").then(function(e){
		// Potree.loadPointCloud("pointclouds/bologna/city/cloud.js", "City").then(function(e){
			viewer.scene.addPointCloud(e.pointcloud);
			e.pointcloud.name = "City";
			e.pointcloud.position.z = 0;
			let material = e.pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.FIXED;
			material.activeAttributeName = "classification";
			
			viewer.fitToScreen();
			window.setDefaultScheme();
		});

		Potree.loadPointCloud("pointclouds/riga/sidewalk/cloud.js", "Sidewalk").then(function(f){
		// Potree.loadPointCloud("pointclouds/bologna/sidewalk/cloud.js", "Sidewalk").then(function(e){
			viewer.scene.addPointCloud(f.pointcloud);
			f.pointcloud.name = "Sidewalk";
			f.pointcloud.position.z = .7;
			let material = f.pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.FIXED;
			material.activeAttributeName = "segment_usable_width";
			
			viewer.fitToScreen();
			window.setDefaultScheme();
		});
		
		
	</script>

	<script type="module">

		import * as THREE from "../libs/three.js/build/three.module.js";

		window.setDefaultScheme = function(){
			// viewer.setClassifications(Potree.ClassificationScheme.DEFAULT);
			const scheme={};
			const palette = {
				0:  [0.5, 0.5, 0.5, 1.0], 
				2:  [0.7, 0.7, 0.8, 1.0], 
				5:  [0.0, 0.4, 0.0, 1.0], 
				8:  [1.0, 0.9, 0.0, 1.0], 
				11: [0.2, 0.2, 0.2, 1.0], 
				13: [1.0, 0.4, 0.7, 1.0], 
				15: [1.0, 0.6, 0.0, 1.0], 
			};
			for (let i =0;i<=15;i++){
				if (palette[i]){
					scheme[i]={
					visible:true,
					name: `Class_${i}`,
					color: palette[i] || [1.0, 1.0, 1.0, 1.0]
				};
				}
			}
			viewer.setClassifications(scheme)
		}

		window.setClassificationColour = function(){
			window.setDefaultScheme();
			viewer.scene.pointclouds.forEach(pointcloud => {
            pointcloud.material.activeAttributeName = "classification";
        	});
		}

		window.setRealColours = function(){
			console.log(viewer.scene.pointclouds.length)
			viewer.scene.pointclouds.forEach((pc, index) => {
				try {
					console.log(`Point Cloud ${index + 1} Name: [${pc.name}]`);
					// const attr = pc.getAttribute("segment_usable_width");
					// if (!attr) {
					// 	window.alert("Attribute segment_usable_width not found!");
					// 	return;
					// }

					// const min = attr.range[0];
					// const max = attr.range[1];
					// const mid = (min + max) / 2;

					// pc.material.gradient = [
					// 	[0.0,  new THREE.Color(0.25, 0.13, 0.0)],
					// 	[0.25, new THREE.Color(0.55, 0.27, 0.07)],
					// 	[0.5,  new THREE.Color(0.85, 0.53, 0.10)],
					// 	[0.75, new THREE.Color(0.95, 0.80, 0.0)],
					// 	[1.0,  new THREE.Color(1.0,  1.0,  0.0)]
					// ];
					if (pc.name==="Sidewalk"){
						const attr = pc.getAttribute("segment_usable_width");
						if (!attr) {
							console.log("Attribute segment_usable_width not found!");
							return;
						}
						console.log("in sidewalk")
						pc.material.activeAttributeName = "segment_usable_width";
						// pc.material.gradient = gradient;
						pc.material.pointColorType = Potree.PointColorType.ATTR; 
						pc.material.pointSizeType = Potree.PointSizeType.FIXED;
						pc.material.size = 1.5;
					}
					else if (pc.name==="City"){
						console.log("in city")
						pc.material.activeAttributeName = "classification";
						// pc.material.gradient = gradient;
						pc.material.pointColorType = Potree.PointColorType.ATTR; 
						pc.material.pointSizeType = Potree.PointSizeType.FIXED;
						pc.material.size = 1.5;
					}
				}
				catch (error){
					console.error(`!!! FATAL ERROR on Point Cloud ${index + 1} !!!`, error);
				}
			});
		}
	</script>
	
	
  </body>
</html>
